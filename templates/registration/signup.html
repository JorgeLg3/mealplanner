{% extends "base.html" %}

{% block title %}Sign up · Meal Planner{% endblock title %}

{% block content %}
  <div class="auth-card">
    <h1>Create an account</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Sign up</button>
    </form>
    <p class="auth-card__switch">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
  </div>
{% endblock content %}
