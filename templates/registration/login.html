{% extends "base.html" %}

{% block title %}Log in · Meal Planner{% endblock title %}

{% block content %}
  <div class="auth-card">
    <h1>Log in</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Log in</button>
    </form>
    <p class="auth-card__switch">Accounts are created by the household admin.</p>
  </div>
{% endblock content %}
