{# The list of open todos; each row is its own swappable partial. #}
{# Context: todos #}
<ul id="todo-list" class="todo-list" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  {% for todo in todos %}
    {% include "todo/_todo.html" %}
  {% empty %}
    <li>No todos yet.</li>
  {% endfor %}
</ul>
